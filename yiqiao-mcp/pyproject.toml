[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yiqiao-mcp"
version = "1.0.0"
description = "REST-only MCP companion for YiQiao"
readme = { text = "YiQiao MCP companion", content-type = "text/plain" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "MODIFICATIONS.md"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "anyio>=4.5.0,<5.0",
    "httpx>=0.28.0,<1.0",
    "jsonschema>=4.20.0,<5.0",
    "mcp>=1.26.0,<2.0",
    "pydantic>=2.11.0,<3.0",
    "starlette>=0.27.0,<2.0",
    "uvicorn>=0.31.1,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
yiqiao-mcp = "yiqiao_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yiqiao_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/yiqiao_mcp/**/*.py",
    "tests/**/*.py",
    "pyproject.toml",
    "Dockerfile",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

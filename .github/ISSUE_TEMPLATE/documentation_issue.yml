# This file was modified in 2026 by YiQiao contributors. See NOTICE.

name: Documentation issue
description: Report incorrect or missing YiQiao documentation
labels: ["documentation"]

body:
  - type: markdown
    attributes:
      value: "[使用简体中文表单](https://github.com/daizhongming/YiQiao/issues/new?template=documentation_issue.zh-CN.yml)"

  - type: input
    id: page
    attributes:
      label: Page or file
      description: Link to the page or repository file that needs attention.
      placeholder: https://github.com/daizhongming/YiQiao/blob/main/docs/yiqiao/...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect, unclear, or missing.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Describe the expected wording or workflow when possible.

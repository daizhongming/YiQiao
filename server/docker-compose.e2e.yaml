# Deterministic release-test overlay. It uses isolated named storage and a
# local OpenAI-compatible provider so smoke tests never contact external APIs.
services:
  model-stub:
    image: python:3.12-alpine
    pull_policy: missing
    init: true
    read_only: true
    command: ["python", "/opt/yiqiao/openai_stub.py"]
    environment:
      STUB_EMBEDDING_DIMS: "16"
    volumes:
      - ../tests/e2e/openai_stub.py:/opt/yiqiao/openai_stub.py:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 15

  yiqiao:
    environment:
      APP_DB_NAME: yiqiao_app
      AUTH_DISABLED: "false"
      ADMIN_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      DATABASE_URL: ""
      EMBEDDING_API_KEY: ""
      GOOGLE_API_KEY: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_LOCATION: ""
      GOOGLE_CLOUD_PROJECT: ""
      GOOGLE_GENAI_USE_VERTEXAI: "false"
      HISTORY_DB_PATH: /app/history/history.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for the E2E stack}
      LLM_API_KEY: ""
      MEM0_DIR: /app/history/yiqiao-state
      MEM0_EMBEDDER_API_KEY: ""
      MEM0_EMBEDDER_PROVIDER: openai
      MEM0_LLM_API_KEY: ""
      MEM0_LLM_PROVIDER: openai
      MEM0_RERANK_API_KEY: ""
      MEM0_RERANK_PROVIDER: ""
      MEMORY_IMPORT_STORAGE_ROOT: /app/history/memory-imports
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENROUTER_API_KEY: ""
      OPENROUTER_API_BASE: ""
      POSTGRES_COLLECTION_NAME: memories
      POSTGRES_DB: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      RERANK_API_KEY: ""
      MEMORY_IMPORT_LLM_API_KEY_ENV: ""
      MEMORY_IMPORT_LLM_BASE_URL: ""
      MEMORY_IMPORT_LLM_PROVIDER: ""
      MEMORY_IMPORT_MODEL_TIERING_ENABLED: "false"
      YIQIAO_DEFAULT_INFER: "false"
      YIQIAO_DISABLE_SPACY_DOWNLOAD: "true"
      YIQIAO_DIR: /app/history/yiqiao-state
      YIQIAO_EMBEDDER_ALLOWED_OPENAI_PARAMS: ""
      YIQIAO_EMBEDDER_BASE_URL: ""
      YIQIAO_EMBEDDER_DIMS: "16"
      YIQIAO_EMBEDDER_MODEL: yiqiao-e2e-embedding
      YIQIAO_EMBEDDER_PROVIDER: openai
      YIQIAO_LLM_BASE_URL: ""
      YIQIAO_LLM_MODEL: yiqiao-e2e
      YIQIAO_LLM_PROVIDER: openai
      YIQIAO_RERANK_MODEL: ""
      YIQIAO_RERANK_PROVIDER: ""
      NEO4J_ENABLED: "false"
      NEO4J_DATABASE: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required for the E2E stack}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the E2E stack}
      OPENAI_API_BASE: ""
      YIQIAO_TELEMETRY: "false"
      YIQIAO_POSTHOG_API_KEY: ""
    volumes:
      - yiqiao_e2e_history:/app/history
    depends_on:
      model-stub:
        condition: service_healthy

  postgres:
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for the E2E stack}
      POSTGRES_USER: postgres

  neo4j:
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required for the E2E stack}

volumes:
  yiqiao_e2e_history:

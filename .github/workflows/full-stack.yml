name: YiQiao Full Stack

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yiqiao-full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Deterministic add, search, and persistence smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yiqiao-mcp/pyproject.toml

      - name: Install the official MCP client dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ./yiqiao-mcp
          python -m pip check

      - name: Run the self-contained full-stack smoke test
        env:
          CI: "true"
        run: python scripts/full_stack_smoke.py

name: YiQiao CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yiqiao-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation localization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate documentation coverage, links, anchors, and commands
        run: make docs-check

      - name: Test documentation validator
        run: python -m unittest -v tests.test_docs_localization

  python-core:
    name: Python ${{ matrix.python-version }} core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q mem0 yiqiao

      - name: Run core tests
        run: python -m pytest -q tests/configs tests/memory tests/utils

  python-server:
    name: Python server and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            server/requirements.txt

      - name: Install server test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[test,dev]"
          python -m pip install --requirement server/requirements.txt
          python -m pip check

      - name: Check Python formatting and imports
        run: make format-check

      - name: Lint Python
        run: make lint-python

      - name: Compile server sources
        run: python -m compileall -q server scripts

      - name: Run server and bundled core tests
        run: make test-python

  python-mcp:
    name: MCP companion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yiqiao-mcp/pyproject.toml

      - name: Install companion test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable "./yiqiao-mcp[test]" ruff==0.16.0 build==1.3.0 twine==7.0.0
          python -m pip check

      - name: Check companion formatting
        run: >-
          python -m ruff format --check
          yiqiao-mcp/src yiqiao-mcp/tests
          scripts/mcp_contract_smoke.py
          tests/test_mcp_contract_smoke.py
          tests/test_full_stack_smoke_mcp.py

      - name: Lint companion and contract smoke
        run: >-
          python -m ruff check
          yiqiao-mcp/src yiqiao-mcp/tests
          scripts/mcp_contract_smoke.py
          tests/test_mcp_contract_smoke.py
          tests/test_full_stack_smoke_mcp.py

      - name: Compile companion sources
        run: python -m compileall -q yiqiao-mcp/src scripts/mcp_contract_smoke.py

      - name: Run companion and contract tests
        run: >-
          python -m pytest -q
          yiqiao-mcp/tests
          tests/test_mcp_contract_smoke.py
          tests/test_full_stack_smoke_mcp.py

      - name: Build and validate the companion wheel
        run: |
          python -m build --wheel yiqiao-mcp
          python -m twine check --strict yiqiao-mcp/dist/*

  python-providers:
    name: Python provider adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install provider test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,vector-stores,llms,extras,nlp]"
          python -m pip install pip-audit==2.10.1
          python -m pip check

      - name: Audit provider dependencies
        run: python -m pip_audit --local --progress-spinner off

      - name: Run provider adapter tests
        run: python -m pytest -q tests/embeddings tests/llms tests/rerankers tests/vector_stores

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server/dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: server/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dashboard formatting
        run: pnpm run format:check

      - name: Lint dashboard
        run: pnpm run lint

      - name: Type-check dashboard
        run: pnpm run typecheck

      - name: Test dashboard components
        run: pnpm run test:unit

      - name: Build dashboard
        run: pnpm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize an ephemeral CI environment
        run: sh scripts/init.sh

      - name: Validate every Compose overlay combination
        run: make compose-config

name: YiQiao Images

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the API and dashboard images to GHCR
        required: true
        default: false
        type: boolean
      version:
        description: Version tag for the published images
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: read

concurrency:
  group: yiqiao-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify ${{ matrix.name }} image
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: .
            file: server/Dockerfile
            tag: yiqiao-api:ci
          - name: Dashboard
            context: .
            file: server/dashboard/Dockerfile
            tag: yiqiao-dashboard:ci
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build from a clean cache without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.tag }}
          platforms: linux/amd64,linux/arm64
          no-cache: true
          pull: true
          push: false
          provenance: false
          sbom: false

  validate-publish-version:
    name: Validate publish version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate version metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib

          release_version = os.environ["RELEASE_VERSION"]
          pattern = re.compile(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)")
          if pattern.fullmatch(release_version) is None:
              raise SystemExit("Version must use the strict vMAJOR.MINOR.PATCH format")

          expected_version = release_version[1:]
          with open("pyproject.toml", "rb") as pyproject_file:
              pyproject_version = tomllib.load(pyproject_file)["project"]["version"]
          with open("server/dashboard/package.json", encoding="utf-8") as package_file:
              dashboard_version = json.load(package_file)["version"]

          mismatches = []
          if pyproject_version != expected_version:
              mismatches.append(f"pyproject.toml has {pyproject_version!r}")
          if dashboard_version != expected_version:
              mismatches.append(f"server/dashboard/package.json has {dashboard_version!r}")
          if mismatches:
              raise SystemExit(
                  f"Version {release_version!r} does not match: " + "; ".join(mismatches)
              )

          print(f"Validated {release_version} against both project version files")
          PY

      - name: Verify release tag targets this commit
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_VERSION}"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Release tag ${RELEASE_VERSION} does not exist"
            exit 1
          fi
          tag_commit="$(git rev-list --max-count=1 "$tag_ref")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag ${RELEASE_VERSION} targets ${tag_commit}, not ${GITHUB_SHA}"
            exit 1
          fi
          echo "Verified ${RELEASE_VERSION} at ${GITHUB_SHA}"

  publish:
    name: Publish ${{ matrix.name }} image
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: validate-publish-version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: .
            file: server/Dockerfile
            image: yiqiao-api
          - name: Dashboard
            context: .
            file: server/dashboard/Dockerfile
            image: yiqiao-dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.version }}
          no-cache: true
          pull: true
          provenance: mode=max
          push: true
          sbom: true

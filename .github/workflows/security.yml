name: YiQiao Security

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yiqiao-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Current tree and full history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit Apache modification notices
        run: python3 scripts/audit_modification_notices.py --fetch-base

      - name: Install Gitleaks 8.28.0
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/gitleaks_8.28.0_linux_x64.tar.gz
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp gitleaks
          sudo install --mode 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current release tree
        run: gitleaks dir --redact=100 --no-banner .

      - name: Scan full history against reviewed fingerprints
        run: gitleaks git --redact=100 --no-banner .

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            server/requirements.txt

      - name: Install audited environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .
          python -m pip install --requirement server/requirements.txt
          python -m pip install pip-audit==2.10.1
          python -m pip check

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --progress-spinner off

  mcp-dependencies:
    name: MCP dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yiqiao-mcp/pyproject.toml

      - name: Install audited companion environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ./yiqiao-mcp pip-audit==2.10.1
          python -m pip check

      - name: Audit companion dependencies
        run: python -m pip_audit --local --progress-spinner off

  dashboard-dependencies:
    name: Dashboard dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: server/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dashboard dependencies
        run: pnpm audit --audit-level high

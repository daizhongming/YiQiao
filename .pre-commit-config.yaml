minimum_pre_commit_version: 3.5.0

repos:
  - repo: local
    hooks:
      - id: yiqiao-ruff-check
        name: YiQiao Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]

      - id: yiqiao-ruff-format
        name: YiQiao Ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]

      - id: yiqiao-isort
        name: YiQiao import order check
        entry: python -m isort --check-only --profile black
        language: system
        types: [python]

name: 缺陷报告
description: 报告 YiQiao 中可复现的异常行为
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "[Use the English form](https://github.com/daizhongming/YiQiao/issues/new?template=bug_report.yml)"

  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      description: 哪个 YiQiao 组件受到影响？
      options:
        - REST API
        - 管理仪表盘
        - Docker Compose 部署
        - Python 记忆核心
        - 身份认证与访问控制
        - 导入与导出
        - 图记忆
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请提供最小可复现示例，并移除凭据和隐私数据。
      value: |
        ### 问题摘要

        ### 复现步骤

        ### 预期行为

        ### 实际行为
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      value: |
        - YiQiao 版本或提交：
        - 部署方式：
        - Docker 与 Compose 版本：
        - 操作系统：
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 安全检查
      options:
        - label: 我已移除 API 密钥、密码、令牌、个人数据和私密记忆内容。
          required: true
